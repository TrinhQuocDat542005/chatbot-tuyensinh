name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements-actions.txt
            requirements-check.txt
            requirements-lock.actions.txt
            requirements-check.linux.txt
      - name: Install into a fresh environment
        run: |
          python -m pip install pip==24.0
          python -m pip install -r requirements-check.linux.txt
          python -m pip check
      - name: Python correctness lint
        run: python -m ruff check actions components scripts tests
      - name: GitHub Actions workflow lint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color
      - name: YAML, JSON, schema and references
        run: |
          python scripts/check_project.py
          python scripts/validate_data.py
          docker compose config --quiet
      - name: Unit and HTTP integration tests
        run: python -m pytest -q --junitxml=results/pytest.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Browser behavior with mock backend
        run: |
          node --check web/app.js
          node --check web/render.js
          node --check tests/web/smoke.cjs
          node --check tests/web/record.cjs
          npm ci
          npx playwright install --with-deps chromium
          python scripts/serve_web.py > results/web-gateway.log 2>&1 &
          python scripts/wait_http.py http://localhost:8686/
          npm run test:web -- --mock
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-${{ github.sha }}
          path: results/
          retention-days: 14
          if-no-files-found: warn
