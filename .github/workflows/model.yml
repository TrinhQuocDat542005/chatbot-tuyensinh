name: Model regression

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'actions/**'
      - 'components/**'
      - 'config.yml'
      - 'domain.yml'
      - 'credentials.yml'
      - 'endpoints*.yml'
      - 'requirements*.txt'
      - 'Dockerfile*'
      - '.dockerignore'
      - 'compose.yaml'
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - 'package*.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'data/**'
      - 'actions/**'
      - 'components/**'
      - '*.yml'
      - 'requirements*.txt'
      - 'Dockerfile*'
      - '.dockerignore'
      - 'compose.yaml'
      - 'scripts/**'
      - 'tests/**'
      - 'web/**'
      - 'package*.json'
      - '.github/workflows/**'
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RASA_TELEMETRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Clean image build and dependency check
        run: |
          mkdir -p results/web-ui results/nlu results/core results/conversations
          docker compose build train actions web
      - name: Validate training data
        run: docker compose run --rm check python -m rasa data validate --fail-on-warnings
      - name: Fresh training with commit and input fingerprints
        run: python scripts/manage.py train --skip-build
      - name: Core, schema and Python regression
        run: python scripts/manage.py check
      - name: Authored NLU regression and gate
        run: |
          docker compose run --rm check python scripts/evaluate_nlu.py --model models/admissions-week4.tar.gz --out results/nlu/ci.json
          python scripts/check_evaluation.py
      - name: Start complete demo
        run: python scripts/manage.py up
      - name: REST and natural-language conversations
        run: |
          docker compose exec -T actions python scripts/smoke_actions.py
          docker compose exec -T rasa python scripts/smoke_rest.py
          docker compose exec -T rasa python scripts/check_conversations.py
          docker compose exec -T rasa python scripts/check_conversations.py --cases tests/conversations/natural.json --out results/conversations/natural-report.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Browser tasks with the freshly trained model
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:web
      - name: Upload verified model bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-${{ github.sha }}
          path: |
            models/admissions-week4.tar.gz
            models/admissions-week4.tar.gz.manifest.json
            models/admissions-week4.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Save service logs
        if: always()
        run: |
          mkdir -p results
          docker compose logs --no-color > results/services.log
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evaluation-${{ github.sha }}
          path: results/
          retention-days: 30
      - name: Shut down services
        if: always()
        run: docker compose down
