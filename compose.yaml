# Local fallback for hosts where Windows blocks Python extension DLLs.
# Docker engine must be running. This is not a public deployment configuration.
services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: chatbot-tuyensinh-web:local
    environment:
      RASA_URL: http://rasa:5005
    depends_on:
      rasa:
        condition: service_healthy
    ports:
      - 127.0.0.1:8686:8686
    volumes:
      - ./results:/app/results
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://localhost:8686/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
  train:
    build: .
    image: chatbot-tuyensinh:local
    profiles: [tools]
    command: [python, scripts/model_artifact.py, train]
    volumes:
      - ./models:/app/models
  check:
    image: chatbot-tuyensinh:local
    build: .
    profiles: [tools]
    command: [bash, -c, "python scripts/check_project.py && python scripts/validate_data.py && python -m ruff check actions components scripts tests && python -m pytest -q --junitxml=results/pytest.xml && python -m rasa data validate --fail-on-warnings && python scripts/model_artifact.py verify && python -m rasa test core --model models/admissions-week4.tar.gz --stories tests/test_stories.yml --out results/core --fail-on-prediction-errors"]
    volumes:
      - ./models:/app/models:ro
      - ./results:/app/results
  actions:
    image: chatbot-tuyensinh-actions:local
    build:
      context: .
      dockerfile: Dockerfile.actions
      target: runtime
    command: [python, -m, rasa_sdk, --actions, actions, --port, '5055']
    ports:
      - 127.0.0.1:${ACTION_PORT:-5055}:5055
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://localhost:5055/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 10s
  rasa:
    image: chatbot-tuyensinh:local
    build: .
    command: [bash, -c, "python scripts/model_artifact.py verify && exec python -m rasa run --model models/admissions-week4.tar.gz --endpoints endpoints.docker.yml --port 5005"]
    depends_on:
      actions:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro
      - ./results:/app/results
    ports:
      - 127.0.0.1:${PORT:-5005}:5005
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://localhost:5005/', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 24
      start_period: 30s
