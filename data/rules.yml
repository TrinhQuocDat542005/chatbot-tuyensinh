version: '3.1'
rules:
- rule: Chào hỏi người dùng khi bắt đầu cuộc trò chuyện
  steps:
  - intent: chao_hoi
  - action: utter_chao_hoi
- rule: Xử lý khi người dùng nhập tên
  steps:
  - intent: nhap_ten
  - action: action_xu_ly_ten
  - action: utter_chao_sau_khi_biet_ten
- rule: Thông tin về ngành tuyển sinh
  steps:
  - intent: hoi_nganh_tuyen_sinh
  - action: action_tra_loi_nganh_tuyen_sinh
- rule: Thông tin giới thiệu về ngành cụ thể
  steps:
  - intent: hoi_thong_tin_gioi_thieu_chung_cua_nganh
  - action: action_prepare_lookup
  - action: tra_cuu_nganh_form
  - active_loop: tra_cuu_nganh_form
- rule: Thông tin về cơ hội việc làm của ngành
  steps:
  - intent: hoi_co_hoi_viec_lam_cua_nganh
  - action: action_prepare_lookup
  - action: tra_cuu_nganh_form
  - active_loop: tra_cuu_nganh_form
- rule: Thông tin về điểm chuẩn của ngành
  steps:
  - intent: hoi_diem_chuan_cua_nganh
  - action: action_prepare_lookup
  - action: tra_cuu_nganh_form
  - active_loop: tra_cuu_nganh_form
- rule: Thông tin về khối xét tuyển của ngành
  steps:
  - intent: hoi_khoi_tuyen_sinh_cua_nganh
  - action: action_prepare_lookup
  - action: tra_cuu_nganh_form
  - active_loop: tra_cuu_nganh_form
- rule: Thông tin về chương trình đào tạo
  steps:
  - intent: hoi_chuong_trinh_dao_tao_cua_truong
  - action: action_tra_loi_thong_tin_truong
- rule: Thông tin về học phí
  steps:
  - intent: hoi_hoc_phi
  - action: action_tra_loi_thong_tin_truong
- rule: Thông tin về địa điểm học
  steps:
  - intent: hoi_dia_diem_hoc
  - action: action_tra_loi_thong_tin_truong
- rule: Thông tin về phương thức xét tuyển
  steps:
  - intent: hoi_phuong_thuc_xet_tuyen
  - action: action_tra_loi_thong_tin_truong
- rule: Thông tin về cơ sở vật chất
  steps:
  - intent: hoi_co_so_vat_chat
  - action: action_tra_loi_thong_tin_truong
- rule: Phản hồi khi người dùng cảm ơn
  steps:
  - intent: cam_on
  - action: utter_cam_on
- rule: Tạm biệt khi người dùng muốn kết thúc cuộc trò chuyện
  steps:
  - intent: tam_biet
  - action: utter_tam_biet
- rule: Tư vấn ngành theo sở thích
  steps:
  - intent: tu_van_nganh_theo_so_thich
  - action: action_tu_van_nganh_theo_so_thich
- rule: Tư vấn ngành theo điểm
  steps:
  - intent: tu_van_nganh_theo_diem
  - action: action_prepare_score
  - action: tu_van_diem_form
  - active_loop: tu_van_diem_form
- rule: Phân tích điểm và gợi ý ngành
  steps:
  - intent: cung_cap_diem
  - action: action_tinh_khoi_va_goi_y_nganh
- rule: Xử lý câu hỏi không rõ ý định
  steps:
  - intent: nlu_fallback
  - action: utter_default
  condition:
  - active_loop: null
- rule: Bổ sung hoặc đổi thông tin tra cứu
  steps:
  - intent: bo_sung_tra_cuu
  - action: action_prepare_lookup
  - action: tra_cuu_nganh_form
  - active_loop: tra_cuu_nganh_form
- rule: Hoàn tất tra cứu
  condition:
  - active_loop: tra_cuu_nganh_form
  steps:
  - action: tra_cuu_nganh_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_submit_lookup
- rule: Hoàn tất nhập điểm
  condition:
  - active_loop: tu_van_diem_form
  steps:
  - action: tu_van_diem_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_tu_van_nganh_theo_diem
- rule: Bắt đầu lại
  steps:
  - intent: bat_dau_lai
  - action: action_restart
- rule: Hủy tra cứu
  steps:
  - intent: huy_tra_cuu
  - action: action_huy_tra_cuu
- rule: Fallback trong tra_cuu_nganh_form
  condition:
  - active_loop: tra_cuu_nganh_form
  steps:
  - intent: nlu_fallback
  - action: utter_default
  - action: tra_cuu_nganh_form
  - active_loop: tra_cuu_nganh_form
- rule: Fallback trong tu_van_diem_form
  condition:
  - active_loop: tu_van_diem_form
  steps:
  - intent: nlu_fallback
  - action: utter_default
  - action: tu_van_diem_form
  - active_loop: tu_van_diem_form
