version: '3.1'
intents:
- chao_hoi
- nhap_ten
- hoi_nganh_tuyen_sinh
- hoi_thong_tin_gioi_thieu_chung_cua_nganh
- hoi_co_hoi_viec_lam_cua_nganh
- hoi_diem_chuan_cua_nganh
- hoi_khoi_tuyen_sinh_cua_nganh
- hoi_chuong_trinh_dao_tao_cua_truong
- hoi_hoc_phi
- hoi_dia_diem_hoc
- hoi_phuong_thuc_xet_tuyen
- hoi_co_so_vat_chat
- cam_on
- tam_biet
- tu_van_nganh_theo_so_thich
- tu_van_nganh_theo_diem
- cung_cap_diem
- nlu_fallback
- bo_sung_tra_cuu
- bat_dau_lai
- huy_tra_cuu
entities:
- ten_nguoi_dung
- ten_nganh
- nam
- diem
- d
- mon_hoc
- phuong_thuc
slots:
  ten_nguoi_dung:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: ten_nguoi_dung
  ten_nganh:
    type: text
    influence_conversation: false
    mappings:
    - type: custom
  d:
    type: list
    mappings:
    - type: from_entity
      entity: d
  mon_hoc:
    type: list
    mappings:
    - type: from_entity
      entity: mon_hoc
  nam:
    type: text
    influence_conversation: false
    mappings:
    - type: custom
  diem:
    type: float
    influence_conversation: false
    mappings:
    - type: custom
  lookup_intent:
    type: text
    influence_conversation: false
    mappings:
    - type: custom
  phuong_thuc:
    type: text
    influence_conversation: false
    mappings:
    - type: custom
responses:
  utter_chao_hoi:
  - text: Xin chào! Mình là chatbot tuyển sinh UTH của dự án độc lập. Bạn có thể hỏi ngay về ngành, điểm chuẩn hoặc
      học phí; không cần cung cấp tên.
  utter_chao_sau_khi_biet_ten:
  - text: Rất vui được gặp bạn, {ten_nguoi_dung}! Tôi có thể giúp gì cho bạn?
  utter_cam_on:
  - text: Không có gì! Rất vui được giúp bạn. Nếu có thắc mắc gì thêm, đừng ngại hỏi nhé!
  - text: Rất vui khi có thể giúp đỡ bạn. Hãy liên hệ với tôi nếu bạn cần thêm thông tin!
  utter_tam_biet:
  - text: Tạm biệt! Chúc bạn một ngày tốt lành.
  - text: Hẹn gặp lại bạn! Chúc bạn những điều tốt đẹp nhất.
  - text: Chào tạm biệt! Nếu cần thêm thông tin, hãy quay lại trò chuyện với tôi nhé.
  utter_default:
  - text: Mình chưa hiểu rõ. Bạn có thể hỏi về ngành, điểm chuẩn, học phí hoặc nhập “hủy tra cứu”.
  utter_ask_tra_cuu_nganh_form_ten_nganh:
  - text: 'Bạn muốn tra cứu ngành nào? Ví dụ: Công nghệ thông tin.'
  utter_ask_tra_cuu_nganh_form_nam:
  - text: 'Bạn muốn tra cứu năm nào? Ví dụ: 2026. Có thể thêm phương thức THPT hoặc xét tuyển kết hợp.'
  utter_ask_tu_van_diem_form_diem:
  - text: 'Bạn hãy nhập tổng điểm 3 môn THPT từ 0 đến 30, ví dụ: 24,5 điểm.'
  utter_restart:
  - text: Đã bắt đầu phiên mới và xóa ngành, năm, tên cùng điểm cũ. Bạn muốn tìm hiểu gì?
actions:
- action_xu_ly_ten
- action_tra_loi_nganh_tuyen_sinh
- action_tra_loi_thong_tin_nganh
- action_tra_loi_co_hoi_viec_lam
- action_tra_loi_diem_chuan_nganh
- action_tra_loi_khoi_xet_tuyen
- action_tu_van_nganh_theo_so_thich
- action_tu_van_nganh_theo_diem
- action_tinh_khoi_va_goi_y_nganh
- action_tra_loi_thong_tin_truong
- action_prepare_lookup
- validate_tra_cuu_nganh_form
- action_submit_lookup
- action_prepare_score
- validate_tu_van_diem_form
- action_huy_tra_cuu
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: false
forms:
  tra_cuu_nganh_form:
    required_slots:
    - ten_nganh
    - nam
  tu_van_diem_form:
    required_slots:
    - diem
